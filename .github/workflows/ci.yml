name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: culturespace
          POSTGRES_PASSWORD: culturespace
          POSTGRES_DB: culturespace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U culturespace -d culturespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      API_PORT: 4000
      DATABASE_URL: postgresql://culturespace:culturespace@localhost:5432/culturespace
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-for-production-use
      APP_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
