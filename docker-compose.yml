name: culture-space

# Development stack. Ports are bound to loopback.
# Production Compose, which does not publish PostgreSQL or Redis, is Milestone 12.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-culturespace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culturespace}
      POSTGRES_DB: ${POSTGRES_DB:-culturespace}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-culturespace} -d ${POSTGRES_DB:-culturespace}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    restart: unless-stopped

  minio:
    # Official minio/minio and quay.io/minio/minio are no longer anonymously
    # pullable. This digest is the public Chainguard MinIO build
    # RELEASE.2026-10-23T20-06-51Z. The server command and MINIO_ROOT_*
    # variables are unchanged.
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culturespace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-culturespace-dev-only}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-culturespace}:${POSTGRES_PASSWORD:-culturespace}@postgres:5432/${POSTGRES_DB:-culturespace}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me!!}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks:
      - internal
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/en').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
